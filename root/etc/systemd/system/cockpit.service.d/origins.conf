[Unit]
After=download-secrets.service
Wants=download-secrets.service

[Service]
# Without the secret, Cockpit falls back to its same-host origin check: the
# tailnet URL keeps working and only the tunnel fails.
ExecStartPre=+/usr/bin/sh -c '{ cat /usr/share/containers/systemd/cockpit/cockpit.conf; cat /run/cockpit-origins/origins.conf || :; } > /etc/cockpit/cockpit.conf'
