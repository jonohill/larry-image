# bootc's bound-image prune fails hard if a stale image ID carries more than
# one tag (identical builds published under two versions). Untag duplicates
# first so the nightly upgrade can't wedge on it.
#
# Prefixed with '-' so a failure here degrades to "the prune might wedge on a
# duplicate tag" rather than "the host silently stops updating entirely" —
# which is what happened when the script hit a read-only /sysroot.
[Service]
ExecStartPre=-/usr/local/sbin/dedupe-bound-images.sh
